<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>parler — learn French out loud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --paper:#ffffff;
  --ink:#0e0e0e;
  --ash:#6d6d6d;
  --line:#ededed;
  --panel:#fafafa;
  --sun:#FFD400;
  --sun-soft:#FFF0A6;
  --focus:#0e0e0e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c0c0c;
    --ink:#f4f4f4;
    --ash:#9c9c9c;
    --line:#232323;
    --panel:#141414;
    --sun:#FFD400;
    --sun-soft:#4a4013;
    --focus:#FFD400;
  }
}
:root[data-theme="dark"]{
  --paper:#0c0c0c; --ink:#f4f4f4; --ash:#9c9c9c; --line:#232323;
  --panel:#141414; --sun:#FFD400; --sun-soft:#4a4013; --focus:#FFD400;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:4px}

.wrap{
  max-width:920px;
  margin:0 auto;
  padding:22px 20px 40px;
  min-height:100%;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* ---------- header ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.logo{
  font-family:"Fraunces",serif;
  font-weight:600;
  font-size:30px;
  letter-spacing:-.01em;
  line-height:1;
  display:inline-flex;
  align-items:baseline;
  gap:2px;
}
.logo .k{position:relative}
.logo .k::after{
  content:"";position:absolute;left:0;right:0;bottom:.06em;height:.28em;
  background:var(--sun);z-index:-1;border-radius:2px;
}
.tag{color:var(--ash);font-size:13.5px;letter-spacing:.01em}

.voice-pick{display:flex;align-items:center;gap:8px}
.voice-pick label{font-size:12.5px;color:var(--ash)}
select{
  appearance:none;-webkit-appearance:none;
  background:var(--panel);color:var(--ink);
  border:1.5px solid var(--line);border-radius:999px;
  padding:8px 34px 8px 14px;font-size:13.5px;font-weight:500;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}

/* ---------- filters ---------- */
.filters{display:flex;flex-direction:column;gap:10px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chiprow .lead{font-size:12px;color:var(--ash);min-width:52px}
.chip{
  border:1.5px solid var(--line);background:transparent;color:var(--ink);
  padding:6px 13px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;
  transition:border-color .15s,background .15s,color .15s;
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#0e0e0e}

/* ---------- stage ---------- */
.stage{
  flex:1;
  border-top:1.5px solid var(--line);
  border-bottom:1.5px solid var(--line);
  padding:34px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:14px;min-height:320px;position:relative;
}
.echo{font-size:14px;color:var(--ash);min-height:20px}
.echo b{color:var(--ink);font-weight:600}

.word{
  font-family:"Fraunces",serif;
  font-weight:600;
  font-size:clamp(2.9rem,12.5vw,6.6rem);
  line-height:.98;
  letter-spacing:-.02em;
  margin:0;
  transition:opacity .2s;
}
.word .art{color:var(--ash);font-weight:400;font-style:italic}
.word.saying{animation:breathe 1.1s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.62}}

.meta{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--ash)}
.ipa{font-family:"Fraunces",serif;font-style:italic;font-size:19px}
.pos{font-size:12.5px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px}

.subtitle{
  font-family:"Fraunces",serif;
  font-size:clamp(1.15rem,4.2vw,1.7rem);
  line-height:1.5;
  max-width:32ch;
  margin:6px auto 0;
  color:var(--ink);
  quotes:"«  " "  »";
}
.subtitle::before{content:open-quote;color:var(--ash)}
.subtitle::after{content:close-quote;color:var(--ash)}
.subtitle .tok{transition:background .12s,color .12s;padding:0 .02em;border-radius:3px}
.subtitle .tok.said{background:var(--sun-soft)}
.subtitle .tok.spoken{background:var(--sun);color:#0e0e0e}
.gloss{font-size:14px;color:var(--ash);margin-top:2px;font-style:normal}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;gap:18px}
.empty .big{
  font-family:"Fraunces",serif;font-size:clamp(1.7rem,6vw,2.7rem);
  line-height:1.15;max-width:16ch;color:var(--ink);font-weight:500;
}
.empty .big em{font-style:italic;color:var(--ash)}
.seeds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seed{
  border:1.5px solid var(--line);background:transparent;color:var(--ink);
  padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer;transition:border-color .15s,transform .1s;
}
.seed:hover{border-color:var(--ink)}
.seed:active{transform:translateY(1px)}

/* ---------- controls ---------- */
.controls{display:flex;flex-direction:column;align-items:center;gap:16px}
.mic-wrap{position:relative;display:grid;place-items:center;width:118px;height:118px}
.mic{
  width:104px;height:104px;border-radius:50%;
  background:var(--sun);border:none;cursor:pointer;
  display:grid;place-items:center;color:#0e0e0e;
  box-shadow:0 6px 0 rgba(0,0,0,.14);
  transition:transform .08s,box-shadow .08s,background .15s;
  position:relative;z-index:2;
}
.mic:hover{transform:translateY(-1px)}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.mic svg{width:40px;height:40px}
.mic[disabled]{background:var(--line);color:var(--ash);cursor:not-allowed;box-shadow:none}
.mic.live{background:#0e0e0e;color:var(--sun)}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--sun);opacity:0;z-index:1}
.mic.live ~ .ring{animation:ping 1.35s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.9);opacity:.7}80%,100%{transform:scale(1.5);opacity:0}}

.hint{font-size:13px;color:var(--ash);min-height:18px}

.type{display:flex;gap:8px;width:100%;max-width:440px}
.type input{
  flex:1;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;
  padding:12px 16px;font-size:15px;color:var(--ink);font-family:inherit;
}
.type input::placeholder{color:var(--ash)}
.type input:focus{border-color:var(--ink);outline:none}
.go{
  border:none;background:var(--ink);color:var(--paper);border-radius:999px;
  width:46px;height:46px;font-size:19px;cursor:pointer;flex:0 0 auto;
  display:grid;place-items:center;transition:opacity .15s;
}
.go:hover{opacity:.85}
.langtog{display:flex;gap:0;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;align-self:center}
.langtog button{
  border:none;background:transparent;color:var(--ash);padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;
}
.langtog button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- trail ---------- */
.trail{display:flex;flex-direction:column;gap:10px}
.trail-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trail-head h2{font-size:13px;font-weight:600;color:var(--ash);margin:0;font-family:inherit;letter-spacing:.01em}
.review{
  border:1.5px solid var(--line);background:transparent;color:var(--ink);
  border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s;
}
.review:hover{border-color:var(--ink)}
.review[disabled]{opacity:.4;cursor:not-allowed}
.trail-list{display:flex;gap:8px;flex-wrap:wrap;min-height:20px}
.trail-list:empty::after{content:"Words you learn this session collect here.";color:var(--ash);font-size:13.5px}
.pill{
  font-family:"Fraunces",serif;font-size:16px;
  border:1.5px solid var(--line);background:transparent;color:var(--ink);
  padding:4px 12px;border-radius:999px;cursor:pointer;transition:border-color .15s;
}
.pill:hover{border-color:var(--sun);}
.note{font-size:12px;color:var(--ash);text-align:center;line-height:1.5}
.note a{color:var(--ink)}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important}
  .mic{transition:none}
}
@media (max-width:560px){
  .wrap{padding:18px 15px 32px;gap:16px}
  .stage{padding:26px 4px;min-height:280px}
  .chiprow .lead{min-width:auto;width:100%}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="logo"><span class="k">parl</span>er</span>
      <span class="tag">learn French out loud</span>
    </div>
    <div class="voice-pick">
      <label for="persona">voice</label>
      <select id="persona" aria-label="Choose the tutor's voice">
        <option value="amelie">Amélie · calm</option>
        <option value="louis">Louis · lively</option>
        <option value="claire" selected>Claire · neutral</option>
        <option value="surprise">Surprise · varies</option>
      </select>
    </div>
  </header>

  <section class="filters" aria-label="Vocabulary filters">
    <div class="chiprow" id="themes" role="group" aria-label="Theme">
      <span class="lead">theme</span>
    </div>
    <div class="chiprow" id="levels" role="group" aria-label="Level">
      <span class="lead">level</span>
    </div>
  </section>

  <main class="stage" id="stage" aria-live="polite">
    <div class="empty" id="empty">
      <div class="big">Say a word. <em>Hear it in&nbsp;French.</em></div>
      <div class="seeds" id="seeds"></div>
    </div>
  </main>

  <section class="controls" aria-label="Ask the tutor">
    <div class="langtog" role="group" aria-label="Input language for the microphone">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-hi" aria-pressed="false">हिं</button>
    </div>
    <div class="mic-wrap">
      <button class="mic" id="mic" aria-label="Tap to speak a word">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </button>
      <span class="ring" aria-hidden="true"></span>
    </div>
    <div class="hint" id="hint">Tap to speak · or type below</div>
    <div class="type">
      <input id="text" type="text" autocomplete="off" spellcheck="false"
             placeholder="Type a word in English or हिंदी…" aria-label="Type a word to translate">
      <button class="go" id="go" aria-label="Translate">→</button>
    </div>
  </section>

  <section class="trail" aria-label="Session vocabulary">
    <div class="trail-head">
      <h2>this session</h2>
      <button class="review" id="review" disabled>↻ Review a word</button>
    </div>
    <div class="trail-list" id="trail" aria-live="polite"></div>
  </section>

  <p class="note">Built with the browser’s Web Speech API — no server, all on-device.<br>
     Works best in Chrome or Edge on desktop. French audio needs a French voice installed on your system.</p>

</div>

<script>
"use strict";
/* =========================================================================
   parler — a French vocabulary voice tutor
   Modules:  VocabStore · SpeechEngine · Recognizer · Trail · UI · App
   Single-file build; each concern kept in its own closure/object.
   ========================================================================= */

/* -------------------------------------------------------------------------
   1. VocabStore — curated bilingual dictionary + lookup
   fields: e=English  h=Hindi  f=French  a=article  g=part/gender  i=IPA
           p=plain phonetic  sf=example (fr)  se=example (en)  t=theme  l=level
   ------------------------------------------------------------------------- */
const VocabStore = (() => {
  const V = [
    // greetings
    {e:"hello",h:"नमस्ते",f:"bonjour",a:"",g:"interj.",i:"bɔ̃.ʒuʁ",p:"bawn-zhoor",sf:"Bonjour, comment ça va ?",se:"Hello, how are you?",t:"greetings",l:"beginner",alt:["hi","hey","good morning"]},
    {e:"thank you",h:"धन्यवाद",f:"merci",a:"",g:"interj.",i:"mɛʁ.si",p:"mair-see",sf:"Merci beaucoup !",se:"Thank you very much!",t:"greetings",l:"beginner",alt:["thanks","thank u"]},
    {e:"goodbye",h:"अलविदा",f:"au revoir",a:"",g:"interj.",i:"o ʁə.vwaʁ",p:"oh ruh-vwahr",sf:"Au revoir, à bientôt !",se:"Goodbye, see you soon!",t:"greetings",l:"beginner",alt:["bye"]},
    {e:"please",h:"कृपया",f:"s’il vous plaît",a:"",g:"interj.",i:"sil vu plɛ",p:"seel voo pleh",sf:"Un café, s’il vous plaît.",se:"A coffee, please.",t:"greetings",l:"beginner",alt:[]},
    {e:"yes",h:"हाँ",f:"oui",a:"",g:"adv.",i:"wi",p:"wee",sf:"Oui, je suis d’accord.",se:"Yes, I agree.",t:"greetings",l:"beginner",alt:["yeah","yep"]},
    {e:"no",h:"नहीं",f:"non",a:"",g:"adv.",i:"nɔ̃",p:"nohn",sf:"Non, merci.",se:"No, thank you.",t:"greetings",l:"beginner",alt:[]},
    {e:"sorry",h:"माफ़ करना",f:"désolé",a:"",g:"adj.",i:"de.zɔ.le",p:"day-zo-lay",sf:"Désolé, je suis en retard.",se:"Sorry, I’m late.",t:"greetings",l:"beginner",alt:["pardon"]},
    // food
    {e:"apple",h:"सेब",f:"pomme",a:"la",g:"n.f.",i:"pɔm",p:"pom",sf:"J’aime manger une pomme.",se:"I like to eat an apple.",t:"food",l:"beginner",alt:[]},
    {e:"bread",h:"रोटी",f:"pain",a:"le",g:"n.m.",i:"pɛ̃",p:"pan",sf:"Je voudrais du pain.",se:"I would like some bread.",t:"food",l:"beginner",alt:[]},
    {e:"water",h:"पानी",f:"eau",a:"l’",g:"n.f.",i:"o",p:"oh",sf:"Un verre d’eau, s’il vous plaît.",se:"A glass of water, please.",t:"food",l:"beginner",alt:[]},
    {e:"cheese",h:"पनीर",f:"fromage",a:"le",g:"n.m.",i:"fʁɔ.maʒ",p:"fro-mahzh",sf:"J’adore le fromage.",se:"I love cheese.",t:"food",l:"beginner",alt:[]},
    {e:"coffee",h:"कॉफ़ी",f:"café",a:"le",g:"n.m.",i:"ka.fe",p:"ka-fay",sf:"Je bois un café le matin.",se:"I drink a coffee in the morning.",t:"food",l:"beginner",alt:[]},
    {e:"milk",h:"दूध",f:"lait",a:"le",g:"n.m.",i:"lɛ",p:"leh",sf:"Le lait est dans le frigo.",se:"The milk is in the fridge.",t:"food",l:"beginner",alt:[]},
    {e:"egg",h:"अंडा",f:"œuf",a:"un",g:"n.m.",i:"œf",p:"uhf",sf:"Je mange un œuf.",se:"I eat an egg.",t:"food",l:"beginner",alt:[]},
    {e:"wine",h:"वाइन",f:"vin",a:"le",g:"n.m.",i:"vɛ̃",p:"van",sf:"Un verre de vin rouge.",se:"A glass of red wine.",t:"food",l:"intermediate",alt:[]},
    {e:"chicken",h:"चिकन",f:"poulet",a:"le",g:"n.m.",i:"pu.lɛ",p:"poo-leh",sf:"Le poulet est délicieux.",se:"The chicken is delicious.",t:"food",l:"intermediate",alt:[]},
    {e:"fish",h:"मछली",f:"poisson",a:"le",g:"n.m.",i:"pwa.sɔ̃",p:"pwah-sohn",sf:"J’aime le poisson.",se:"I like fish.",t:"food",l:"intermediate",alt:[]},
    // travel
    {e:"train",h:"ट्रेन",f:"train",a:"le",g:"n.m.",i:"tʁɛ̃",p:"tran",sf:"Le train part à midi.",se:"The train leaves at noon.",t:"travel",l:"beginner",alt:[]},
    {e:"airport",h:"हवाई अड्डा",f:"aéroport",a:"l’",g:"n.m.",i:"a.e.ʁɔ.pɔʁ",p:"ah-ay-ro-por",sf:"L’aéroport est loin.",se:"The airport is far.",t:"travel",l:"intermediate",alt:[]},
    {e:"ticket",h:"टिकट",f:"billet",a:"le",g:"n.m.",i:"bi.jɛ",p:"bee-yeh",sf:"J’achète un billet.",se:"I’m buying a ticket.",t:"travel",l:"intermediate",alt:[]},
    {e:"hotel",h:"होटल",f:"hôtel",a:"l’",g:"n.m.",i:"o.tɛl",p:"oh-tel",sf:"L’hôtel est près de la gare.",se:"The hotel is near the station.",t:"travel",l:"beginner",alt:[]},
    {e:"map",h:"नक्शा",f:"carte",a:"la",g:"n.f.",i:"kaʁt",p:"kart",sf:"Regarde la carte.",se:"Look at the map.",t:"travel",l:"intermediate",alt:[]},
    {e:"street",h:"सड़क",f:"rue",a:"la",g:"n.f.",i:"ʁy",p:"roo",sf:"La rue est calme.",se:"The street is quiet.",t:"travel",l:"beginner",alt:[]},
    {e:"left",h:"बायाँ",f:"gauche",a:"",g:"n.f./adj.",i:"ɡoʃ",p:"gohsh",sf:"Tournez à gauche.",se:"Turn left.",t:"travel",l:"intermediate",alt:[]},

    {e:"mother",h:"माँ",f:"mère",a:"la",g:"n.f.",i:"mɛʁ",p:"mair",sf:"Ma mère est gentille.",se:"My mother is kind.",t:"family",l:"beginner",alt:["mom","mum"]},
    {e:"father",h:"पिता",f:"père",a:"le",g:"n.m.",i:"pɛʁ",p:"pair",sf:"Mon père travaille beaucoup.",se:"My father works a lot.",t:"family",l:"beginner",alt:["dad"]},
    {e:"friend",h:"दोस्त",f:"ami",a:"un",g:"n.m.",i:"a.mi",p:"ah-mee",sf:"C’est mon ami.",se:"This is my friend.",t:"family",l:"beginner",alt:[]},
    {e:"child",h:"बच्चा",f:"enfant",a:"l’",g:"n.m.",i:"ɑ̃.fɑ̃",p:"ahn-fahn",sf:"L’enfant joue dehors.",se:"The child plays outside.",t:"family",l:"intermediate",alt:["kid"]},
    {e:"sister",h:"बहन",f:"sœur",a:"la",g:"n.f.",i:"sœʁ",p:"sur",sf:"J’ai une sœur.",se:"I have a sister.",t:"family",l:"beginner",alt:[]},
    {e:"brother",h:"भाई",f:"frère",a:"le",g:"n.m.",i:"fʁɛʁ",p:"frair",sf:"Mon frère est grand.",se:"My brother is tall.",t:"family",l:"beginner",alt:[]},
    // numbers
    {e:"one",h:"एक",f:"un",a:"",g:"num.",i:"œ̃",p:"uhn",sf:"J’ai un chien.",se:"I have one dog.",t:"numbers",l:"beginner",alt:["1"]},
    {e:"two",h:"दो",f:"deux",a:"",g:"num.",i:"dø",p:"duh",sf:"Deux cafés, s’il vous plaît.",se:"Two coffees, please.",t:"numbers",l:"beginner",alt:["2"]},

    {e:"ten",h:"दस",f:"dix",a:"",g:"num.",i:"dis",p:"dees",sf:"J’ai dix euros.",se:"I have ten euros.",t:"numbers",l:"beginner",alt:["10"]},
    // colors
    {e:"red",h:"लाल",f:"rouge",a:"",g:"adj.",i:"ʁuʒ",p:"roozh",sf:"La pomme est rouge.",se:"The apple is red.",t:"colors",l:"beginner",alt:[]},

    {e:"school",h:"स्कूल",f:"école",a:"l’",g:"n.f.",i:"e.kɔl",p:"ay-kol",sf:"L’école commence à huit heures.",se:"School starts at eight.",t:"everyday",l:"beginner",alt:[]},
    {e:"sun",h:"सूरज",f:"soleil",a:"le",g:"n.m.",i:"sɔ.lɛj",p:"so-lay",sf:"Le soleil brille.",se:"The sun is shining.",t:"everyday",l:"beginner",alt:[]}
  ];

  const themes = ["all", ...Array.from(new Set(V.map(w => w.t)))];
  const norm = s => (s || "").toString().trim().toLowerCase()
                      .replace(/[.,!?;:"'’`«»]/g, "").replace(/^to\s+/, "").replace(/\s+/g, " ");
  const normHi = s => (s || "").toString().trim().replace(/[।.,!?;:"'’`]/g, "").replace(/\s+/g, " ");

  function find(query){
    const q = norm(query), qh = normHi(query);
    if (!q && !qh) return null;
    // exact matches first
    for (const w of V){
      if (norm(w.e) === q) return w;
      if (normHi(w.h) === qh || norm(w.h) === q) return w;
      if (norm(w.f) === q) return w;
      if (w.alt.some(a => norm(a) === q)) return w;
    }
    // loose contains (English side only, guarded for length)
    if (q.length >= 3){
      for (const w of V){
        const we = norm(w.e);
        if (we.includes(q) || q.includes(we)) return w;
        if (w.alt.some(a => { const na = norm(a); return na.includes(q) || q.includes(na); })) return w;
      }
    }
    return null;
  }

  const pool = (theme, level) => V.filter(w =>
    (theme === "all" || w.t === theme) && (level === "all" || w.l === level));

  const random = (theme, level, exclude) => {
    let list = pool(theme, level).filter(w => w.f !== exclude);
    if (!list.length) list = pool(theme, level);
    if (!list.length) list = V;
    return list[Math.floor(Math.random() * list.length)];
  };

  const byFrench = fr => V.find(w => w.f === fr) || null;

  return { all:V, themes, find, random, byFrench, pool };
})();

/* -------------------------------------------------------------------------
   2. SpeechEngine — French TTS with personas, modulation + subtitle sync
   ------------------------------------------------------------------------- */
const SpeechEngine = (() => {
  const synth = window.speechSynthesis;
  const supported = !!synth;
  let frVoices = [], anyVoices = [];

  const personas = {
    amelie:   { rate:0.9,  pitch:1.08 },
    louis:    { rate:1.08, pitch:0.92 },
    claire:   { rate:1.0,  pitch:1.0  },
  };

  function loadVoices(){
    anyVoices = supported ? synth.getVoices() : [];
    frVoices = anyVoices.filter(v => /^fr(-|_|$)/i.test(v.lang) || /fran|french/i.test(v.name));
  }
  if (supported){
    loadVoices();
    synth.onvoiceschanged = loadVoices;
  }

  const hasFrenchVoice = () => frVoices.length > 0;

  function pickVoice(personaKey, seed){
    if (!frVoices.length) return null;
    // distribute distinct voices across personas when several exist
    const order = ["claire","amelie","louis","surprise"];
    let idx = order.indexOf(personaKey);
    if (idx < 0) idx = 0;
    if (personaKey === "surprise") idx = (seed || 0);
    return frVoices[idx % frVoices.length];
  }

  // resolve a persona (handles "surprise" -> random with jitter)
  function resolve(personaKey, seed){
    if (personaKey === "surprise"){
      const keys = Object.keys(personas);
      const base = personas[keys[seed % keys.length]];
      return {
        rate: +(base.rate + (Math.random()*0.16 - 0.08)).toFixed(2),
        pitch:+(base.pitch + (Math.random()*0.2 - 0.1)).toFixed(2),
        voice: pickVoice("surprise", seed)
      };
    }
    const base = personas[personaKey] || personas.claire;
    return { rate:base.rate, pitch:base.pitch, voice: pickVoice(personaKey, seed) };
  }

  function makeUtterance(text, cfg){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    if (cfg.voice) u.voice = cfg.voice;
    u.rate = cfg.rate; u.pitch = cfg.pitch; u.volume = 1;
    return u;
  }

  /* Speak the isolated word, then the example sentence.
     Calls hooks so the UI can highlight in sync.
     tokens: [{start,end}] char ranges inside `sentence`. */
  function speakLesson({ word, sentence, tokens, cfg, onWord, onSentenceStart, onBoundary, onDone }){
    if (!supported){ onDone && onDone(); return; }
    synth.cancel();

    const u1 = makeUtterance(word, cfg);
    u1.onstart = () => onWord && onWord();

    const u2 = makeUtterance(sentence, cfg);
    let boundaryFired = false, fallbackTimer = null, idx = 0;

    u2.onstart = () => {
      onSentenceStart && onSentenceStart();
      // fallback: if the browser never fires boundary events, advance on a timer
      const est = Math.max(1500, sentence.length * 78 / (cfg.rate || 1));
      const per = est / Math.max(1, tokens.length);
      fallbackTimer = setInterval(() => {
        if (boundaryFired){ clearInterval(fallbackTimer); return; }
        if (idx >= tokens.length){ clearInterval(fallbackTimer); return; }
        onBoundary && onBoundary(idx, tokens.length);
        idx++;
      }, per);
    };
    u2.onboundary = (e) => {
      if (e.name && e.name !== "word") return;
      boundaryFired = true;
      if (fallbackTimer){ clearInterval(fallbackTimer); fallbackTimer = null; }
      // map charIndex -> token
      const ci = e.charIndex;
      let t = tokens.findIndex(tk => ci >= tk.start && ci < tk.end);
      if (t < 0) t = tokens.findIndex(tk => ci <= tk.end);
      if (t >= 0) onBoundary && onBoundary(t, tokens.length);
    };
    u2.onend = () => { if (fallbackTimer) clearInterval(fallbackTimer); onDone && onDone(); };
    u2.onerror = () => { if (fallbackTimer) clearInterval(fallbackTimer); onDone && onDone(); };

    synth.speak(u1);
    synth.speak(u2);
  }

  const stop = () => { if (supported) synth.cancel(); };

  return { supported, resolve, speakLesson, stop, hasFrenchVoice, _reload:loadVoices };
})();

/* -------------------------------------------------------------------------
   3. Recognizer — speech-to-text wrapper (EN / HI)
   ------------------------------------------------------------------------- */
const Recognizer = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const supported = !!SR;
  let rec = null, listening = false;

  function start(lang, { onInterim, onFinal, onEnd, onError }){
    if (!supported) return false;
    try { if (rec) rec.abort(); } catch(_){}
    rec = new SR();
    rec.lang = lang;              // "en-US" | "hi-IN"
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.continuous = false;
    listening = true;

    rec.onresult = (ev) => {
      let interim = "", final = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++){
        const r = ev.results[i];
        if (r.isFinal) final += r[0].transcript;
        else interim += r[0].transcript;
      }
      if (interim && onInterim) onInterim(interim);
      if (final && onFinal) onFinal(final.trim());
    };
    rec.onerror = (e) => { listening = false; onError && onError(e.error); };
    rec.onend   = () => { listening = false; onEnd && onEnd(); };
    try { rec.start(); return true; }
    catch(_){ listening = false; return false; }
  }
  const stop = () => { try { if (rec) rec.stop(); } catch(_){} listening = false; };
  const isListening = () => listening;

  return { supported, start, stop, isListening };
})();

/* -------------------------------------------------------------------------
   4. Trail — session word memory (localStorage, gracefully optional)
   ------------------------------------------------------------------------- */
const Trail = (() => {
  const KEY = "parler.trail.v1";
  let words = [];
  try { const raw = localStorage.getItem(KEY); if (raw) words = JSON.parse(raw) || []; }
  catch(_){ words = []; }

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(words.slice(-40))); } catch(_){} };
  function add(fr){
    words = words.filter(w => w !== fr); // move to most-recent
    words.push(fr); save();
  }
  const list = () => words.slice();
  const random = () => words.length ? words[Math.floor(Math.random()*words.length)] : null;
  return { add, list, random };
})();

/* -------------------------------------------------------------------------
   5. UI — DOM rendering
   ------------------------------------------------------------------------- */
const UI = (() => {
  const $ = id => document.getElementById(id);
  const stage = $("stage");
  const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

  // split a sentence into word tokens with char offsets (keeps punctuation with words)
  function tokenize(sentence){
    const tokens = [];
    const re = /\S+/g; let m;
    while ((m = re.exec(sentence)) !== null){
      tokens.push({ text:m[0], start:m.index, end:m.index + m[0].length });
    }
    return tokens;
  }

  function renderEcho(text, lang){
    const flag = lang === "hi" ? "हिंदी" : "English";
    return `<div class="echo">you said (${flag}): <b>${esc(text)}</b></div>`;
  }

  function renderCard(entry, echoText, echoLang){
    const tokens = tokenize(entry.sf);
    const spans = tokens.map((t,i) => `<span class="tok" data-i="${i}">${esc(t.text)}</span>`).join(" ");
    const art = entry.a ? `<span class="art">${esc(entry.a)} </span>` : "";
    stage.innerHTML =
      (echoText ? renderEcho(echoText, echoLang) : `<div class="echo"></div>`) +
      `<h1 class="word" id="bigword">${art}${esc(entry.f)}</h1>` +
      `<div class="meta">
         <span class="ipa">[${esc(entry.i)}]</span>
         <span class="pos">${esc(entry.g)}</span>
       </div>` +
      `<p class="subtitle" id="subtitle">${spans}</p>` +
      `<div class="gloss">${esc(entry.se)}</div>`;
    return { tokens };
  }

  function renderMiss(entry, echoText, echoLang){
    // graceful "unknown word" — still teaches something from the current filter
    const tokens = tokenize(entry.sf);
    const spans = tokens.map((t,i) => `<span class="tok" data-i="${i}">${esc(t.text)}</span>`).join(" ");
    const art = entry.a ? `<span class="art">${esc(entry.a)} </span>` : "";
    stage.innerHTML =
      (echoText ? renderEcho(echoText, echoLang) : "") +
      `<div class="echo" style="margin-top:-6px">not in the wordbook yet — here’s one to try</div>` +
      `<h1 class="word" id="bigword">${art}${esc(entry.f)}</h1>` +
      `<div class="meta">
         <span class="ipa">[${esc(entry.i)}]</span>
         <span class="pos">${esc(entry.g)}</span>
       </div>` +
      `<p class="subtitle" id="subtitle">${spans}</p>` +
      `<div class="gloss">${esc(entry.se)}</div>`;
    return { tokens };
  }

  function sayingWord(on){
    const w = $("bigword"); if (w) w.classList.toggle("saying", !!on);
  }
  function highlight(i){
    const sub = $("subtitle"); if (!sub) return;
    const toks = sub.querySelectorAll(".tok");
    toks.forEach((el, idx) => {
      el.classList.toggle("spoken", idx === i);
      if (idx < i) el.classList.add("said");
    });
  }
  function clearHighlight(all){
    const sub = $("subtitle"); if (!sub) return;
    sub.querySelectorAll(".tok").forEach(el => {
      el.classList.remove("spoken");
      if (all) el.classList.add("said");
    });
  }

  function renderTrail(words, onPick){
    const box = $("trail"); box.innerHTML = "";
    words.slice().reverse().forEach(fr => {
      const b = document.createElement("button");
      b.className = "pill"; b.textContent = fr;
      b.addEventListener("click", () => onPick(fr));
      box.appendChild(b);
    });
    $("review").disabled = words.length === 0;
  }

  function buildChips(container, values, current, onPick){
    // keep the leading label, drop old chips
    container.querySelectorAll(".chip").forEach(c => c.remove());
    values.forEach(v => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = v;
      b.setAttribute("aria-pressed", String(v === current));
      b.addEventListener("click", () => onPick(v));
      container.appendChild(b);
    });
  }
  function setPressed(container, current){
    container.querySelectorAll(".chip").forEach(c =>
      c.setAttribute("aria-pressed", String(c.textContent === current)));
  }

  return { renderCard, renderMiss, sayingWord, highlight, clearHighlight,
           renderTrail, buildChips, setPressed, tokenize };
})();

/* -------------------------------------------------------------------------
   6. Backend — talks to our own server, which holds the Groq key
   Health probe decides the mode: "groq" (server+key present) or "local".
   ------------------------------------------------------------------------- */
const Backend = (() => {
  const st = { checked:false, available:false, groq:false, stt:false, chat:false };

  async function detect(){
    try {
      const r = await fetch("/api/health", { method:"GET" });
      if (!r.ok) throw new Error("no backend");
      const j = await r.json();
      st.available = true;
      st.groq = !!j.groq;
      st.stt  = !!(j.groq && j.stt);
      st.chat = !!(j.groq && j.chat);
    } catch(_){
      st.available = false; st.groq = false; st.stt = false; st.chat = false;
    }
    st.checked = true;
    return st;
  }

  // audio Blob -> transcript text via Groq Whisper (server side)
  async function transcribe(blob, lang){
    const fd = new FormData();
    fd.append("audio", blob, "command.webm");
    if (lang) fd.append("lang", lang);
    const r = await fetch("/api/transcribe", { method:"POST", body:fd });
    if (!r.ok) throw new Error("transcribe failed: " + r.status);
    const j = await r.json();
    return (j.text || "").trim();
  }

  // text -> structured French lesson via Groq LLM (server side)
  // returns an entry shaped exactly like a VocabStore row so the UI is unchanged
  async function translate(text, lang){
    const r = await fetch("/api/translate", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ text, lang })
    });
    if (!r.ok) throw new Error("translate failed: " + r.status);
    const j = await r.json();
    return {
      e: j.source || text, h:"",
      f: j.french || text,
      a: j.article || "",
      g: j.gender || "",
      i: j.ipa || "",
      p: j.phonetic || "",
      sf: j.example_fr || j.french || text,
      se: j.example_en || j.source || text,
      t:"", l:"", alt:[]
    };
  }

  return { state:st, detect, transcribe, translate };
})();

/* -------------------------------------------------------------------------
   7. AudioCapture — MediaRecorder wrapper (used only in Groq mode)
   Works in every modern browser, including Safari/Firefox/mobile.
   ------------------------------------------------------------------------- */
const AudioCapture = (() => {
  const supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
                       window.MediaRecorder);
  let rec = null, chunks = [], stream = null;

  function pickMime(){
    const types = ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"];
    for (const t of types) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
    return "";
  }

  async function start(){
    stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mime = pickMime();
    rec = mime ? new MediaRecorder(stream, { mimeType:mime }) : new MediaRecorder(stream);
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.start();
  }

  function stop(){
    return new Promise((resolve, reject) => {
      if (!rec){ reject(new Error("not recording")); return; }
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
        if (stream) stream.getTracks().forEach(t => t.stop());
        rec = null; stream = null;
        resolve(blob);
      };
      try { rec.stop(); } catch(e){ reject(e); }
    });
  }

  const isRecording = () => !!rec && rec.state === "recording";
  return { supported, start, stop, isRecording };
})();

/* -------------------------------------------------------------------------
   8. App — controller / state
   Routes through Groq when the backend is live; falls back to on-device
   Web Speech + local wordbook when it isn't. UI is identical either way.
   ------------------------------------------------------------------------- */
(() => {
  const $ = id => document.getElementById(id);
  const state = {
    theme: "all",
    level: "all",
    persona: "claire",
    inputLang: "en",
    seed: 0,
    current: null,
    busy: false
  };
  const cache = new Map(); // french -> entry, so Groq-made words survive in the trail

  try {
    const p = JSON.parse(localStorage.getItem("parler.prefs.v1") || "{}");
    if (p.persona) state.persona = p.persona;
    if (p.inputLang) state.inputLang = p.inputLang;
  } catch(_){}
  const savePrefs = () => { try {
    localStorage.setItem("parler.prefs.v1", JSON.stringify({ persona:state.persona, inputLang:state.inputLang }));
  } catch(_){} };

  /* ---- filters ---- */
  const themeBox = $("themes"), levelBox = $("levels");
  UI.buildChips(themeBox, VocabStore.themes, state.theme, t => { state.theme = t; UI.setPressed(themeBox, t); });
  UI.buildChips(levelBox, ["all","beginner","intermediate"], state.level, l => { state.level = l; UI.setPressed(levelBox, l); });

  /* ---- persona ---- */
  const personaSel = $("persona");
  personaSel.value = state.persona;
  personaSel.addEventListener("change", () => { state.persona = personaSel.value; savePrefs(); });

  /* ---- language toggle ---- */
  const langEn = $("lang-en"), langHi = $("lang-hi");
  function setLang(l){
    state.inputLang = l; savePrefs();
    langEn.setAttribute("aria-pressed", String(l === "en"));
    langHi.setAttribute("aria-pressed", String(l === "hi"));
  }
  setLang(state.inputLang);
  langEn.addEventListener("click", () => setLang("en"));
  langHi.addEventListener("click", () => setLang("hi"));

  const mic = $("mic"), hint = $("hint");
  function setHint(t){ hint.textContent = t; }

  /* ---- core: render + speak a lesson (unchanged visuals) ---- */
  function teach(entry, echoText, echoLang, isMiss){
    state.current = entry;
    state.seed++;
    if (entry.f) cache.set(entry.f, entry);
    const view = isMiss
      ? UI.renderMiss(entry, echoText, echoLang)
      : UI.renderCard(entry, echoText, echoLang);
    Trail.add(entry.f);
    UI.renderTrail(Trail.list(), onTrailPick);

    if (!SpeechEngine.supported) return;
    if (!SpeechEngine.hasFrenchVoice()) SpeechEngine._reload();
    const cfg = SpeechEngine.resolve(state.persona, state.seed);
    const spoken = (entry.a ? entry.a + " " : "") + entry.f;
    SpeechEngine.speakLesson({
      word: spoken,
      sentence: entry.sf,
      tokens: view.tokens,
      cfg,
      onWord: () => UI.sayingWord(true),
      onSentenceStart: () => { UI.sayingWord(false); UI.clearHighlight(false); },
      onBoundary: (i) => UI.highlight(i),
      onDone: () => { UI.sayingWord(false); UI.clearHighlight(true); }
    });
  }

  /* ---- resolve a query into a lesson (Groq first, local fallback) ---- */
  async function handleQuery(text, langHint){
    const q = (text || "").trim();
    if (!q || state.busy) return;
    const lang = langHint || state.inputLang;

    if (Backend.state.chat){
      state.busy = true;
      setHint("Translating with Groq…");
      try {
        const entry = await Backend.translate(q, lang);
        teach(entry, q, lang, false);
        setHint(defaultHint());
      } catch(err){
        // graceful fallback to the local wordbook
        localAnswer(q, lang);
        setHint("Groq unavailable — used the offline wordbook");
      } finally { state.busy = false; }
      return;
    }
    localAnswer(q, lang);
  }

  function localAnswer(q, lang){
    const entry = VocabStore.find(q);
    if (entry) teach(entry, q, lang, false);
    else teach(VocabStore.random(state.theme, state.level, null), q, lang, true);
  }

  function onTrailPick(fr){
    const e = cache.get(fr) || VocabStore.byFrench(fr);
    if (e) teach(e, null, null, false);
  }

  /* ---- text input ---- */
  const textInput = $("text"), goBtn = $("go");
  const detectLang = s => /[\u0900-\u097F]/.test(s) ? "hi" : "en";
  function submitText(){
    const v = textInput.value.trim();
    if (!v) return;
    handleQuery(v, detectLang(v));
    textInput.value = "";
  }
  goBtn.addEventListener("click", submitText);
  textInput.addEventListener("keydown", e => { if (e.key === "Enter") submitText(); });

  /* ---- seeds ---- */
  const seeds = [["apple","en"],["thank you","en"],["पानी","hi"],["dog","en"],["merci","en"]];
  const seedBox = $("seeds");
  seeds.forEach(([w,l]) => {
    const b = document.createElement("button");
    b.className = "seed"; b.textContent = w;
    b.addEventListener("click", () => handleQuery(w, l));
    seedBox.appendChild(b);
  });

  /* ---- review ---- */
  $("review").addEventListener("click", () => {
    const fr = Trail.random();
    if (fr){ const e = cache.get(fr) || VocabStore.byFrench(fr); if (e) teach(e, null, null, false); }
  });

  /* ---- microphone: Groq (MediaRecorder) OR on-device (Web Speech) ---- */
  const defaultHint = () =>
    Backend.state.stt ? "Tap to speak (Groq) · or type below"
                      : "Tap to speak · or type below";

  async function groqMicToggle(){
    if (AudioCapture.isRecording()){
      // stop -> transcribe -> translate
      mic.classList.remove("live");
      mic.setAttribute("aria-label","Tap to speak a word");
      setHint("Transcribing with Groq…");
      state.busy = true;
      try {
        const blob = await AudioCapture.stop();
        const text = await Backend.transcribe(blob, state.inputLang);
        state.busy = false;
        if (!text){ setHint("Didn’t catch that — try again, or type below"); return; }
        await handleQuery(text, state.inputLang);
      } catch(err){
        state.busy = false;
        setHint("Groq transcription failed — type a word instead");
      }
      return;
    }
    // start recording
    SpeechEngine.stop();
    try {
      await AudioCapture.start();
      mic.classList.add("live");
      mic.setAttribute("aria-label","Recording — tap to stop and translate");
      setHint(state.inputLang === "hi" ? "रिकॉर्ड हो रहा है… रोकने के लिए टैप करें"
                                       : "Recording… tap to stop & translate");
    } catch(err){
      mic.classList.remove("live");
      setHint("Microphone blocked — allow mic access, or type below");
    }
  }

  function browserMicToggle(){
    if (Recognizer.isListening()){ Recognizer.stop(); return; }
    SpeechEngine.stop();
    const lang = state.inputLang === "hi" ? "hi-IN" : "en-US";
    mic.classList.add("live");
    mic.setAttribute("aria-label", "Listening — tap to stop");
    setHint(state.inputLang === "hi" ? "सुन रहा हूँ… कोई शब्द बोलिए" : "Listening… say a word");
    const ok = Recognizer.start(lang, {
      onInterim: (t) => setHint("… " + t),
      onFinal: (t) => { setHint(defaultHint()); handleQuery(t, state.inputLang); },
      onEnd: () => { mic.classList.remove("live"); mic.setAttribute("aria-label","Tap to speak a word");
                     const h = hint.textContent;
                     if (h.startsWith("…")||h.startsWith("Listening")||h.startsWith("सुन")) setHint(defaultHint()); },
      onError: (err) => {
        mic.classList.remove("live");
        setHint(err === "not-allowed" || err === "service-not-allowed"
          ? "Microphone blocked — allow mic access, or type below"
          : "Didn’t catch that — try again, or type below");
      }
    });
    if (!ok){ mic.classList.remove("live"); setHint("Couldn’t start the mic — type a word instead"); }
  }

  function wireMic(){
    // decide the mic strategy from the detected mode
    if (Backend.state.stt && AudioCapture.supported){
      mic.disabled = false;
      mic.addEventListener("click", () => { groqMicToggle(); });
    } else if (Recognizer.supported){
      mic.disabled = false;
      mic.addEventListener("click", () => { browserMicToggle(); });
    } else {
      mic.disabled = true;
      mic.setAttribute("aria-label", "Voice input isn’t supported in this browser");
      setHint("Voice input isn’t supported here — type a word instead");
    }
  }

  /* ---- footer note reflects the active engine (content only, not design) ---- */
  function updateNote(){
    const note = document.querySelector(".note");
    if (!note) return;
    if (Backend.state.groq){
      const bits = [];
      if (Backend.state.stt) bits.push("Groq Whisper speech-to-text");
      if (Backend.state.chat) bits.push("Groq Llama 3.3 translation");
      note.innerHTML = "Voice pipeline: " + bits.join(" + ") +
        ".<br>French audio + synced subtitles play on-device via the Web Speech API.";
    }
    // if no backend: keep the original on-device note already in the markup
  }

  /* ---- boot ---- */
  (async () => {
    await Backend.detect();
    wireMic();
    setHint(defaultHint());
    updateNote();
    // catch late-loaded system French voices for TTS
    setTimeout(() => { if (SpeechEngine.supported && !SpeechEngine.hasFrenchVoice()) SpeechEngine._reload(); }, 700);
  })();
})();
</script>
</body>
</html>
